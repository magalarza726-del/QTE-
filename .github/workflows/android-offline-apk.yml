name: QTE Lab - Android APK offline
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-offline-apk.yml'
      - 'index.html'
      - '*.js'
      - '*.css'
      - 'animation/**'
      - 'audio/**'
      - 'camera/**'
      - 'characters/**'
      - 'combat/**'
      - 'core/**'
      - 'effects/**'
      - 'emblems/**'
      - 'particles/**'
      - 'storage/**'
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-offline-apk.yml'
      - 'index.html'
      - '*.js'
      - '*.css'
      - 'animation/**'
      - 'audio/**'
      - 'camera/**'
      - 'characters/**'
      - 'combat/**'
      - 'core/**'
      - 'effects/**'
      - 'emblems/**'
      - 'particles/**'
      - 'storage/**'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Install SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify original web files
        run: |
          test -f index.html
          test -f data.js
          test -f main.js
          test -f combat/qte-engine.js
      - name: Build APK (debug)
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Verify packaged offline assets
        run: |
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -q 'assets/www/index.html'
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -q 'assets/www/main.js'
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -q 'assets/www/data.js'
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QTE-Lab-Android-offline-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
